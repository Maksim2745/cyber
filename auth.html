<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/ui-kit.css">
    <link rel="stylesheet" href="./css/auth.css">
    <title>Авторизация</title>
</head>
<body>
    <main>
        <div class="auth-wrapper container">
            <div class="auth">
                <h2 class="auth-title">Авторизация</h2>
                <form class="auth-form">
                    <div class="auth-form__login-wrapper">
                        <label for="login">Введите логин</label>
                        <input class="auth-form__login" placeholder="Введите логин" type="text" id="login" name="login">                    
                    </div>
                    <div class="auth-form__password-wrapper">
                        <label for="password">Введите пароль</label>
                        <input class="auth-form__password" placeholder="Введите пароль" type="password" id="password" name="password">
                    </div>

                    <button type="submit" class="ui-button--secondary auth-form__button">Войти</button>
                    <a href="./registration.html" class="auth-form__button-reg">Регистрация</a>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
